[project]
name = "pc3-conformal"
version = "1.1.0"
description = "Physics-Constrained Conformal Prediction for Composites (PC3) — reproduction code for the paper 'An Uncertainty-Aware Decision-Support System for Composite-Property Prediction with Physically Admissible Conformal Intervals' (Information, MDPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "M. Sarsenbay" },
  { name = "S. Zhuzbayev" },
  { name = "G. Baenova" },
  { name = "G. Alkhanova" },
  { name = "R. Niyazova" },
  { name = "A. Bakytzhan" },
]
keywords = ["conformal prediction", "uncertainty quantification", "physical bounds", "composite materials"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "shap>=0.44",
  "ngboost>=0.5",
  "pymatgen>=2023.1",
  "matminer>=0.9",
]

[project.urls]
Homepage = "https://github.com/magzhansaken/pc3-conformal"
Repository = "https://github.com/magzhansaken/pc3-conformal"

[project.optional-dependencies]
test = ["pytest>=7.0"]
